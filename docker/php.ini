memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
date.timezone = America/Argentina/Buenos_Aires
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
